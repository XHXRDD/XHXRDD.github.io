<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>摩尔缠论 · 线段中枢分析工具（增强版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow-x: hidden; }
        body {
            background: #0f0f1a;
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #eef2ff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .navbar {
            background: rgba(18, 18, 28, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(66, 153, 225, 0.3);
            padding: 0.5rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-shrink: 0;
            z-index: 20;
        }
        .logo-area h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, #c084fc, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo-area p { font-size: 0.65rem; color: #8b9bcf; }
        .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
        .nav-links a {
            color: #cbd5ff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover { color: #60a5fa; }
        .search-section {
            background: rgba(26, 26, 38, 0.9);
            margin: 0.6rem 1rem 0.3rem 1rem;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(66, 153, 225, 0.4);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            flex-shrink: 0;
            position: relative;
            z-index: 25;
        }
        .search-wrapper { flex: 3; min-width: 180px; position: relative; }
        #autoComplete {
            width: 100%;
            padding: 0.6rem 1.2rem;
            background: #1e1e2c;
            border: 1px solid #2d3a5e;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: #f0f3fa;
            outline: none;
        }
        #autoComplete:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .search-info {
            font-size: 0.7rem;
            color: #8f9bb3;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #2d2d44;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.65rem;
        }
        .current-stock {
            background: #1e2a3a;
            border-radius: 2rem;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #90e0ff;
        }
        /* 历史记录区域 */
        .history-section {
            margin: 0.2rem 1rem 0 1rem;
            padding: 0.3rem 0.8rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #8b9bcf;
            background: rgba(18,18,28,0.6);
            border-radius: 2rem;
            backdrop-filter: blur(2px);
        }
        .history-label {
            color: #8b9bcf;
            letter-spacing: 1px;
        }
        .history-tag {
            background: #1e2a3a;
            border-radius: 1.2rem;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.1s;
            color: #cbd5ff;
            border: 1px solid #2d3a5e;
        }
        .history-tag:hover {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }
        /* K线图容器（相对定位用于loading层） */
        .chart-container {
            flex: 1 1 auto;
            margin: 0.2rem 1rem 0.2rem 1rem;
            background: #00000022;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(66, 153, 225, 0.3);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            min-height: calc(100vh - 140px);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a12;
        }
        /* 加载动画层 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 1rem;
            flex-direction: column;
            gap: 1rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #2d3a5e;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text {
            color: #eef2ff;
            font-size: 0.85rem;
        }
        .footer-badge {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.7rem;
            background: #0a0a10;
            border-top: 1px solid #222;
            margin-top: 0.5rem;
        }
        /* 候选列表宽度样式（保留原版） */
        .autoComplete_wrapper { position: relative; z-index: 100 !important; width: 100%; }
        .autoComplete_results {
            z-index: 9999 !important;
            background: #1e1e2c !important;
            border: 1px solid #3b82f6 !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
            max-height: 400px;
            overflow-y: auto;
            min-width: 360px !important;
            width: auto !important;
            max-width: 90vw !important;
            left: 0 !important;
        }
        @media (max-width: 640px) {
            .autoComplete_results { min-width: 75vw !important; }
        }
        .autoComplete_result {
            background: #1e1e2c !important;
            border-bottom: 1px solid #2d3a5e !important;
            padding: 10px 14px !important;
        }
        .autoComplete_result:hover { background: #2a2a3c !important; }
        .autoComplete_result span:first-child { min-width: 70px; flex-shrink: 0; }
        .autoComplete_result span:nth-child(2) { flex: 2; }
        .autoComplete_result span:last-child { flex-shrink: 0; min-width: 65px; text-align: right; }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937dd;
            backdrop-filter: blur(8px);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #bbf0ff;
            pointer-events: none;
            z-index: 10000;
            border: 1px solid #3b82f6;
        }
        @media (max-width: 680px) {
            .navbar { padding: 0.4rem 1rem; }
            .search-section { margin: 0.5rem 0.8rem; flex-direction: column; align-items: stretch; }
            .history-section { margin: 0.2rem 0.8rem; }
            .chart-container { margin: 0.2rem 0.5rem; min-height: calc(100vh - 180px); }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.7/dist/css/autoComplete.min.css">
</head>
<body>
<div class="navbar">
    <div class="logo-area"><h1>📈 摩尔缠论 · F30线段 + 日线线段 + 走势分类中枢 + 终完美中枢</h1><p>F30线段 | 日线中枢</p></div>
    <div class="nav-links">
        <a href="TDXDLL.html">🔧 通达信DLL</a>
        <a href="TDXExtraLink.html">🔗 外部链接</a>
        <a href="meclyksp.html">📺 原课程</a>
        <a href="goodsites.html">⭐ 推荐站点</a>
    </div>
</div>
<div class="search-section">
    <div class="search-wrapper"><input id="autoComplete" type="text" placeholder="🔍 代码/名称/简拼 (如 贵州茅台, 600519)" autocomplete="off"></div>
    <div class="search-info">
        <span class="badge">深市 000001~399999</span>
        <span class="badge">沪市 600000~999999</span>
        <span id="currentStockLabel" class="current-stock">📊 上证指数 999999</span>
    </div>
</div>
<!-- 最近浏览历史区域 -->
<div class="history-section" id="historySection">
    <span class="history-label">📌 最近浏览：</span>
    <div id="historyTags" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
</div>
<div class="chart-container" id="chartContainer">
    <iframe id="stockChartFrame" src="https://zettathings.top/public/webhqchart.demo/demo/RXZT.html?symbol=999999.sh&v=20240101" title="日K线+缠论线段中枢" loading="lazy"></iframe>
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <div class="loading-text">加载K线数据中...</div>
    </div>
</div>
<div class="footer-badge">
    <a href="https://info.flagcounter.com/1iAv" target="_blank" rel="noopener"><img src="https://s11.flagcounter.com/count2/1iAv/bg_0F0F1A/txt_9CA3AF/border_2D3A5E/columns_2/maxflags_10/viewers_0/labels_0/pageviews_0/flags_0/percent_0/" alt="访问统计" border="0"></a>
    <span style="margin-left: 8px; color:#6b7280;">📜 向下滚动可见统计</span>
</div>
<div id="globalToast" class="toast-msg" style="opacity:0; visibility: hidden;"></div>

<script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.7/dist/autoComplete.min.js"></script>
<script>
    (function() {
        // ----- DOM 元素 -----
        let currentFrame = document.getElementById('stockChartFrame');
        let stockLabel = document.getElementById('currentStockLabel');
        let toastEl = document.getElementById('globalToast');
        let loadingOverlay = document.getElementById('loadingOverlay');
        let historyTagsContainer = document.getElementById('historyTags');

        // ----- 工具函数 -----
        function showMessage(msg, isError = false) {
            if(!toastEl) return;
            toastEl.textContent = msg;
            toastEl.style.backgroundColor = isError ? '#b91c1ccc' : '#1f2937dd';
            toastEl.style.opacity = '1';
            toastEl.style.visibility = 'visible';
            setTimeout(() => { toastEl.style.opacity = '0'; toastEl.style.visibility = 'hidden'; }, 2500);
        }

        // 显示/隐藏 loading 动画
        function showLoading(show) {
            if (!loadingOverlay) return;
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        // 加载 iframe 并处理 loading 状态
        function setIframeSrc(url, callback) {
            showLoading(true);
            currentFrame.src = url;
            // 监听 iframe 加载完成
            const onLoad = () => {
                showLoading(false);
                currentFrame.removeEventListener('load', onLoad);
                if (callback) callback();
            };
            currentFrame.addEventListener('load', onLoad);
            // 超时保护：10秒后强制隐藏loading
            setTimeout(() => {
                if (loadingOverlay && loadingOverlay.style.display === 'flex') {
                    showLoading(false);
                    console.warn('iframe 加载超时');
                }
            }, 10000);
        }

        // 核心：切换股票（只更新iframe，不打开新窗口）
        function loadStockKLineInPlace(code, stockName, saveToHistory = true) {
            if (!code || code.length !== 6 || !/^\d+$/.test(code)) {
                showMessage('❌ 请输入6位数字代码', true);
                return false;
            }
            let marketSuffix = '', marketType = '';
            const codeNum = parseInt(code, 10);
            if (codeNum > 0 && codeNum < 400000) {
                marketSuffix = '.sz';
                marketType = '深市';
            } else if (codeNum > 599999 && codeNum < 1000000) {
                marketSuffix = '.sh';
                marketType = '沪市';
            } else {
                showMessage('❌ 无效A股代码 (深:000001-399999, 沪:600000-999999)', true);
                return false;
            }
            const symbolFull = code + marketSuffix;
            const targetUrl = `https://zettathings.top/public/webhqchart.demo/demo/RXZT.html?symbol=${symbolFull}&v=${Date.now()}`;
            
            // 更新 iframe（带动画）
            setIframeSrc(targetUrl);
            
            const displayName = stockName ? `${stockName} ${code}` : `${code} (${marketType})`;
            stockLabel.innerHTML = `📈 当前: ${displayName}`;
            showMessage(`✅ 已切换至 ${displayName}`, false);
            
            // 保存到历史记录（若需要）
            if (saveToHistory) {
                addToHistory({ code: code, name: stockName || code });
            }
            return true;
        }

        // ----- 历史记录管理 (localStorage) -----
        const HISTORY_KEY = 'recent_stocks';
        const MAX_HISTORY = 5;
        
        function getHistory() {
            const stored = localStorage.getItem(HISTORY_KEY);
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch(e) { return []; }
            }
            return [];
        }
        
        function saveHistory(history) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
            renderHistoryTags();
        }
        
        function addToHistory(stock) {
            if (!stock || !stock.code) return;
            let history = getHistory();
            // 去重（基于代码）
            history = history.filter(item => item.code !== stock.code);
            // 插入到最前
            history.unshift({ code: stock.code, name: stock.name });
            if (history.length > MAX_HISTORY) history.pop();
            saveHistory(history);
        }
        
        function renderHistoryTags() {
            if (!historyTagsContainer) return;
            const history = getHistory();
            if (history.length === 0) {
                historyTagsContainer.innerHTML = '<span style="color:#5f6b8a;">暂无</span>';
                return;
            }
            historyTagsContainer.innerHTML = history.map(item => {
                const displayName = item.name && item.name !== item.code ? item.name : item.code;
                return `<div class="history-tag" data-code="${item.code}" data-name="${item.name || ''}">📌 ${displayName}</div>`;
            }).join('');
            // 绑定点击事件
            document.querySelectorAll('.history-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const code = tag.getAttribute('data-code');
                    const name = tag.getAttribute('data-name');
                    if (code) loadStockKLineInPlace(code, name, true);
                });
            });
        }
        
        // ----- 股票列表缓存（24小时有效）-----
        const CACHE_KEY = 'stock_list_cache';
        const CACHE_EXPIRE = 24 * 60 * 60 * 1000; // 24小时
        
        async function fetchStockListWithCache() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_EXPIRE) {
                        console.log('使用缓存股票列表');
                        showMessage('📦 股票列表已从本地缓存加载', false);
                        return data;
                    } else {
                        console.log('缓存过期，重新获取');
                    }
                } catch(e) {}
            }
            // 无缓存或过期，发起网络请求
            showMessage('🔄 首次加载股票列表，请稍候...', false);
            const response = await fetch("https://zettathings.top/stocklist.json");
            if (!response.ok) throw new Error("列表加载失败");
            const data = await response.json();
            localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, timestamp: Date.now() }));
            showMessage('✅ 股票列表已更新并缓存', false);
            return data;
        }
        
        // ----- autoComplete 初始化 -----
        let autoCompleteJS = null;
        const initAutoComplete = async () => {
            try {
                const stockData = await fetchStockListWithCache();
                document.getElementById("autoComplete").setAttribute("placeholder", "📊 输入代码/名称/简拼...");
                autoCompleteJS = new autoComplete({
                    data: {
                        src: stockData,
                        keys: ["code","name","jp"],
                        cache: true,
                        filter: (list) => {
                            const filtered = [];
                            const map = new Map();
                            for(const item of list) {
                                if(!map.has(item.match)) {
                                    map.set(item.match, item);
                                    filtered.push(item);
                                }
                            }
                            return filtered;
                        }
                    },
                    placeHolder: "🔎 搜索股票",
                    resultsList: {
                        maxResults: 18,
                        noResults: true,
                        tabSelect: true,
                        element: (list, data) => {
                            if(data.results.length===0) {
                                const info = document.createElement("div");
                                info.innerHTML = `<span style="color:#aaa;">💡 未找到 "${data.query}"</span>`;
                                info.style.padding = "0.8rem";
                                info.style.textAlign = "center";
                                list.prepend(info);
                            }
                        }
                    },
                    resultItem: {
                        element: (item, data) => {
                            item.style = "display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; gap: 12px; font-size: 14px; cursor: pointer;";
                            item.innerHTML = `<span style="font-weight:600; min-width:70px; color:#facc15;">${data.value.code}</span><span style="flex:2; color:#7dd3fc; font-weight:600;">${data.value.name}</span><span style="color:#9ca3af; font-family:monospace; white-space: nowrap;">${data.value.jp || ''}</span>`;
                        },
                        highlight: true
                    },
                    events: {
                        input: {
                            selection: (event) => {
                                const feedback = event.detail;
                                if(feedback && feedback.selection) {
                                    const selected = feedback.selection.value;
                                    if(selected && selected.code && selected.code.length===6) {
                                        loadStockKLineInPlace(selected.code, selected.name, true);
                                    } else {
                                        showMessage("选择无效", true);
                                    }
                                }
                                autoCompleteJS.input.blur();
                                autoCompleteJS.input.value = '';
                            },
                            focus() {
                                if(autoCompleteJS.input.value.length) autoCompleteJS.start();
                            }
                        }
                    },
                    searchEngine: "strict"
                });
                // 渲染历史记录
                renderHistoryTags();
            } catch(err) {
                console.error(err);
                document.getElementById("autoComplete").setAttribute("placeholder", "⚠️ 股票列表加载失败");
                showMessage("无法获取股票列表，请刷新页面重试", true);
            }
        };
        
        initAutoComplete();
        
        // 回车搜索
        const inputEl = document.getElementById("autoComplete");
        if(inputEl) {
            inputEl.addEventListener("keypress", (e) => {
                if(e.key==="Enter") {
                    e.preventDefault();
                    const val = inputEl.value.trim();
                    if(val.length===6 && /^\d+$/.test(val)) {
                        loadStockKLineInPlace(val, '', true);
                        inputEl.value = '';
                        if(autoCompleteJS) autoCompleteJS.close();
                    } else if(val.length>0) {
                        showMessage("请输入6位数字代码后按回车", true);
                    }
                }
            });
        }
        
        // 初始时加载一次历史记录，并确保当前显示的股票也加入历史（上证指数）
        window.addEventListener('load', () => {
            // 将默认的上证指数也记录到历史中（如果还没有）
            const defaultCode = '999999';
            const defaultName = '上证指数';
            let history = getHistory();
            const exists = history.some(item => item.code === defaultCode);
            if (!exists) {
                addToHistory({ code: defaultCode, name: defaultName });
            } else {
                renderHistoryTags();
            }
        });
    })();
</script>
</body>
</html>

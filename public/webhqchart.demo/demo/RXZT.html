<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src *; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data:; font-src *;">

    <title>日K线图</title>
    <link rel="stylesheet" href="../jscommon/umychart.resource/css/tools.css" />
    <link rel="stylesheet" href="../jscommon/umychart.resource/font/iconfont.css" />
    <script>
        let url = window.location.href;
        let id = "symbol";
        let id1 = "symbol1";
        if (url.indexOf("?") != -1) {
            let str = url.substr(url.indexOf("?") + 1);
            id1 = str.split("=")[1];
            id = id1.substr(0, 9);
        }
        document.title = id;
    </script>
</head>
<body>
    <div id="kline" style="width: 900px;height:400px;position: absolute;"></div>
    <script src="content/js/jquery.min.js"></script>
    <script src="content/js/webfont.js"></script>

    <script src="../jscommon/umychart.network.js"></script>
    <script src="../jscommon/umychart.js"></script>
    <script src="../jscommon/umychart.complier.js"></script>
    <script src="../jscommon/umychart.index.data.js"></script>
    <script src="../jscommon/umychart.style.js"></script>

    <script>
        WebFont.load({ custom: { families: ['iconfont'] } });
        JSComplier.AddVariant({ Name: 'ZSSG', Description: '中枢上轨' });

        function getURLParams(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURI(r[2]);
            return null;
        }

        // resize 防抖：避免拖动窗口/移动端旋转时高频触发 OnSize
        var resizeTimer = null;
        function onWindowResize() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvas, 150);
        }
        $(window).resize(onWindowResize);

        function resizeCanvas() {
            var height = $(window).height();
            var width = $(window).width();
            var divKline = document.getElementById('kline');
            divKline.style.top = 0 + 'px';
            divKline.style.left = 0 + 'px';
            divKline.style.width = (width) + 'px';
            divKline.style.height = (height) + 'px';
            divKline.JSChart.OnSize();
        }

        // ========== 腾讯接口适配与分页核心 ==========

        /**
         * 将 HQChart 内部代码（如 "1.600000"）转为腾讯格式（"sh600000"）
         */
        function toTencentSymbol(internalSymbol) {
            // internalSymbol 格式可能是 "1.600000" 或 "0.000001"
            var parts = internalSymbol.split('.');
            var market = parts[0]; // "1" = 上海, "0" = 深圳
            var code = parts[1];
            var suffix = (market === '1') ? 'sh' : 'sz';
            return suffix + code;
        }

        /**
         * 获取复权参数
         */
        function getAdjParam(right) {
            if (right === 0) return '';   // 不复权
            if (right === 1) return 'qfq'; // 前复权
            if (right === 2) return 'hfq'; // 后复权
            return 'qfq';
        }

        /**
         * 获取周期参数
         */
        function getTencentPeriod(period) {
            var map = { 0: 'day', 1: 'week', 2: 'month' };
            return map[period] || 'day';
        }

        /**
         * 构建单次请求的 URL（强制从最新往过去取）
         * 腾讯接口单次上限 640 根，但总量上限约 2000 根。
         */
        function buildTencentUrl(fullSymbol, period, endDate, count, adj) {
            // endDate 为空字符串时表示从最新数据开始取
            var param = fullSymbol + ',' + getTencentPeriod(period) + ',,' + endDate + ',' + count + ',' + adj;
            return 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + param;
        }

        /**
         * 从单次返回中提取 K 线数组（优先 qfqday / hfqday）
         */
        function extractKlineArray(stockData, adj) {
            var keys = [];
            if (adj === 'qfq') keys = ['qfqday', 'qfqweek', 'qfqmonth', 'day', 'week', 'month'];
            else if (adj === 'hfq') keys = ['hfqday', 'hfqweek', 'hfqmonth', 'day', 'week', 'month'];
            else keys = ['day', 'week', 'month', 'qfqday', 'hfqday'];

            for (var i = 0; i < keys.length; i++) {
                if (stockData[keys[i]] && stockData[keys[i]].length > 0) {
                    return stockData[keys[i]];
                }
            }
            return [];
        }

        /**
         * 计算日期字符串的前一天，用于分页游标
         */
        function previousDay(dateStr) {
            var d = new Date(Date.parse(dateStr));
            d.setDate(d.getDate() - 1);
            var y = d.getFullYear();
            var m = ('0' + (d.getMonth() + 1)).slice(-2);
            var day = ('0' + d.getDate()).slice(-2);
            return y + '-' + m + '-' + day;
        }

        /**
         * 异步分页获取全部K线数据（核心分页逻辑）
         * - 单次请求 640 根
         * - 总量上限约 2000 根
         * - 每次请求间隔 250ms（腾讯接口仅 3~4 次请求，缩短整体等待）
         */
        function fetchAllKlinePaged(fullSymbol, period, adj, callback) {
            var MAX_TOTAL = 2000;
            var PAGE_SIZE = 640;
            var REQUEST_INTERVAL = 250; // ms，缩小翻页等待，降低首屏总耗时
            var allKlines = [];
            var endDate = ''; // 第一次为空，从最新开始
            var requestCount = 0;

            function fetchNextPage() {
                if (allKlines.length >= MAX_TOTAL) {
                    finish();
                    return;
                }

                var url = buildTencentUrl(fullSymbol, period, endDate, PAGE_SIZE, adj);
                console.log('[分页] 第 ' + (requestCount + 1) + ' 次请求，endDate=' + (endDate || '最新') + ', 已获取 ' + allKlines.length + ' 根');

                $.ajax({
                    type: 'GET',
                    url: url,
                    dataType: 'json',
                    success: function(json) {
                        requestCount++;
                        if (!json || !json.data) {
                            finish();
                            return;
                        }

                        var dataKey = Object.keys(json.data)[0];
                        var stockData = json.data[dataKey];
                        if (!stockData) {
                            finish();
                            return;
                        }

                        var batch = extractKlineArray(stockData, adj);
                        if (!batch || batch.length === 0) {
                            finish();
                            return;
                        }

                        // 将本批数据拼接到前面（因为是从新到旧翻页，批次本身是升序）
                        allKlines = batch.concat(allKlines);

                        // 如果本批不足一页，说明已经取完
                        if (batch.length < PAGE_SIZE) {
                            finish();
                            return;
                        }

                        // 计算下一页的终点日期：本批最早一天的前一日
                        var earliestDate = batch[0][0]; // 例如 "2024-03-04"
                        endDate = previousDay(earliestDate);

                        // 遵守限流，等待后继续
                        setTimeout(fetchNextPage, REQUEST_INTERVAL);
                    },
                    error: function(xhr, status, err) {
                        console.error('[分页] 请求失败:', status, err);
                        // 如果已有数据，则用已有数据；否则最终会回调空数据
                        finish();
                    }
                });
            }

            function finish() {
                // 按时间升序排序（确保从旧到新）
                allKlines.sort(function(a, b) {
                    return a[0] < b[0] ? -1 : 1;
                });

                // 截取最近的 MAX_TOTAL 根
                var result = allKlines.slice(-MAX_TOTAL);
                console.log('[分页] 完成，共获取 ' + result.length + ' 根K线');
                callback(result);
            }

            fetchNextPage();
        }

        // ========== HQChart 网络回调（使用分页） ==========

        function RequestHistoryData(data, callback) {
            data.PreventDefault = true;
            var symbol = data.Request.Data.symbol; // 例如 "1.600000"
            var period = data.Self.Period;         // 0=日线
            var right = data.Self.Right;           // 1=前复权

            var fullSymbol = toTencentSymbol(symbol);
            var adj = getAdjParam(right);

            fetchAllKlinePaged(fullSymbol, period, adj, function(klines) {
                // 将腾讯格式的 K 线数组转换为 HQChart 格式
                var hqChartData = { code: 0, data: [] };

                // 股票名称（可选，从第一次请求的 qt 中获取，但分页场景下简化处理）
                hqChartData.name = ''; 
                hqChartData.symbol = symbol;

                if (!klines || klines.length === 0) {
                    callback(hqChartData);
                    return;
                }

                // 第一根的昨收：用第一根的开盘价近似（或保持0，HQChart 可处理）
                var yClose = parseFloat(klines[0][1]) || 0;

                for (var i = 0; i < klines.length; i++) {
                    var item = klines[i];
                    if (!item || item.length < 6) continue;

                    var dateStr = item[0];
                    var today = new Date(Date.parse(dateStr));
                    var date = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();

                    var open  = parseFloat(item[1]);
                    var close = parseFloat(item[2]);
                    var high  = parseFloat(item[3]);
                    var low   = parseFloat(item[4]);
                    var vol   = parseFloat(item[5]) * 100; // 手 -> 股

                    // HQChart 格式: [日期, 昨收, 开盘, 最高, 最低, 收盘, 成交量, 成交额]
                    hqChartData.data.push([date, yClose, open, high, low, close, vol, 0]);
                    yClose = close;
                }

                if (data.Self.IsDestroy == false) {
                    callback(hqChartData);
                }
            });
        }

        // ========== 原有 NetworkFilter（保留指标加载逻辑，仅替换数据请求） ==========

        function NetworkFilter(data, callback) {
            console.log('[NetworkFilter] data', data);
            data.PreventDefault = true;

            var symbol1 = getURLParams('symbol');
            if (symbol1 == null) data.Request.Data.symbol = '0.002981';
            else {
                let mk = "0.";
                let code = "000000";
                mk = symbol1.substr(6, 8);
                code = symbol1.substr(0, 6);
                if (mk == ".sz") data.Request.Data.symbol = "0." + code;
                else if (mk == ".sh") data.Request.Data.symbol = "1." + code;
                if (code == "999999") data.Request.Data.symbol = "1.000001";
            }

            switch (data.Name) {
                case 'KLineChartContainer::RequestHistoryData':
                    RequestHistoryData(data, callback);
                    break;
            }

            // 以下指标加载逻辑完全保留你原代码中的实现（Moore线段等）
            if (data.Name == 'APIScriptIndex::ExecuteScript') {
                var request = data.Request;
                if (request.Data.indexname == 'Moore线段') {
                    var hqchart = data.HQChart;
                    var kData = hqchart.ChartPaint[0].Data;
                    data.PreventDefault = true;

                    var line1 = { name: 'MULTI_LINE', type: 1, Draw: { DrawType: 'MULTI_LINE', DrawData: [], LineWidth: 1, } };
                    var line2 = { name: 'MULTI_LINE', type: 1, Draw: { DrawType: 'MULTI_LINE', DrawData: [], LineWidth: 2, } };
                    var line3 = { name: 'MULTI_LINE', type: 1, Draw: { DrawType: 'MULTI_LINE', DrawData: [], LineWidth: 3, } };

                    var symbol = getURLParams('symbol');
                    if (symbol == null) symbol = '002981.sz';
                    const indicatorTypes = ['ZSFLZS', 'F30XD', 'ZWMZS', 'RXXD'];
                    Promise.all(indicatorTypes.map(function(type) {
                        return fetch('https://zettathings.top/public/' + type + '/' + symbol + '.json')
                            .then(function(response) {
                                if (!response.ok) throw new Error(type + ' 请求失败: HTTP ' + response.status);
                                return response.json();
                            });
                    })).then(function(indicatorData) {
                        var ZSpoint = indicatorData[0];
                        var XDpoint = indicatorData[1];
                        var ZWMZSpoint = indicatorData[2];
                        var RXXDpoint = indicatorData[3];

                        var lastEnding = 0;
                        var curpoint = JSON.parse(JSON.stringify(ZSpoint));
                        for (let i = 0; i < ZSpoint.Point.length; i++) {
                            if (ZSpoint.Point[i].Value == 0 || ZSpoint.Point[i].Value == -1) {
                                var tmppointcontent = curpoint.Point.slice(lastEnding, i);
                                curpoint.Point = tmppointcontent;
                                curpoint.Color = ZSpoint.Point[i].Value == 0 ? "rgb(244, 0, 0)" : "rgb(0, 244, 0)";
                                lastEnding = i + 1;
                                line2.Draw.DrawData.push(curpoint);
                                curpoint = JSON.parse(JSON.stringify(ZSpoint));
                            }
                        }

                        XDpoint.Color = "rgb(255, 255, 0)";
                        line1.Draw.DrawData.push(XDpoint);

                        var lastEndingzwm = 0;
                        var curpointzwm = JSON.parse(JSON.stringify(ZWMZSpoint));
                        for (let i = 0; i < ZWMZSpoint.Point.length; i++) {
                            if (ZWMZSpoint.Point[i].Value == 0 || ZWMZSpoint.Point[i].Value == -1) {
                                var tmppointcontentzwm = curpointzwm.Point.slice(lastEndingzwm, i);
                                curpointzwm.Point = tmppointcontentzwm;
                                curpointzwm.Color = "rgb(244, 55, 244)";
                                lastEndingzwm = i + 1;
                                line2.Draw.DrawData.push(curpointzwm);
                                curpointzwm = JSON.parse(JSON.stringify(ZWMZSpoint));
                            }
                        }

                        RXXDpoint.Color = "rgb(255, 0, 0)";
                        line3.Draw.DrawData.push(RXXDpoint);

                        var apiData = {
                            code: 0,
                            stock: { name: hqchart.Name, symbol: hqchart.Symbol },
                            outdata: { date: kData.GetDate(), outvar: [line1, line2, line3] }
                        };
                        console.log('[NetworkFilter] apiData', apiData);
                        callback(apiData);
                    }).catch(function(error) {
                        console.error('指标数据加载失败:', error);
                    });
                }
            }
            else if (data.Name == 'JSSymbolData::GetCustomVariantData') {
                // 修复：原始代码把一个匿名函数赋值给了函数调用的结果（非法左值），
                // 运行时会抛错且 this 指向不确定。这里改为直接构造数据并通过 callback 返回。
                data.PreventDefault = true;
                var hqchartData = { Data: [], DataType: 0 };
                hqchartData.Data.push({ Date: 20201205, Value: 15 });
                hqchartData.Data.push({ Date: 20210105, Value: 10 });
                hqchartData.Data.push({ Date: 20210107, Value: 20 });
                callback(hqchartData);
            }
        }

        // ========== 初始化 ==========

        $(function () {
            var debug = getURLParams('debug');
            if (debug == 1) { var vConsole = new VConsole(); }

            var symbol = getURLParams('symbol');
            if (symbol == null) symbol = '002981.sz';

            var chart = JSChart.Init(document.getElementById('kline'));
            var blackStyle = HQChartStyle.GetStyleConfig(STYLE_TYPE_ID.BLACK_ID);
            JSChart.SetStyle(blackStyle);

            var height = $(window).height();
            var width = $(window).width();
            var divKline = document.getElementById('kline');
            divKline.style.width = width + 'px';
            divKline.style.height = height + 'px';
            divKline.style.backgroundColor = blackStyle.BGColor;
            chart.OnSize();

            var option = {
                Type: '历史K线图',
                Windows: [{ Index: 'Moore线段', API: { Name: 'Moore线段', Script: null, Args: null }, IsShareY: true, Modify: true, Change: true, Overlay: true }],
                OverlayIndex: [{ Index: 'Moore线段', Windows: 0, IsShareY: true }, { Index: 'MA', Windows: 0, IsShareY: true, ShowRightText: false }],
                IsShareY: true,
                IsCalculateYMaxMin: true,
                Symbol: symbol,
                blackStyle: true,
                CheckLatestVerion: false,
                IsAutoUpdate: false,
                NetworkFilter: NetworkFilter,
                IsShowRightMenu: true,
                IsShowCorssCursorInfo: true,
                CorssCursorInfo: { Left: 1, Right: 1, Bottom: 1, IsShowCorss: true, PressTime: 300 },
                KLine: {
                    DragMode: 1,
                    Right: 1,
                    Period: 0,
                    MaxReqeustDataCount: 2000, // 与分页上限对齐
                    MaxRequestMinuteDayCount: 6,
                    PageSize: 600,
                    InfoPosition: 1,
                    KLineDoubleClick: false,
                    IsShowTooltip: true,
                    DrawType: 0,
                },
                KLineTitle: { IsShowName: true, IsShowSettingInfo: true },
                Border: { Left: 5, Right: 60, Bottom: 25, Top: 25 },
                Language: "CN",
                ExtendChart: [{ Name: '画图工具', Top: 25 }],
                Frame: [
                    { SplitCount: 5, IsShowLeftText: false, IsShowRightText: true },
                    { SplitCount: 3, IsShowLeftText: false, IsShowRightText: true },
                    { SplitCount: 2, IsShowLeftText: false, IsShowRightText: true }
                ],
            };

            var windowWidth = $(window).width();
            if (windowWidth <= 420) {
                option.Border.Left = 1;
                option.Border.Right = 1;
                option.KLine.IsShowTooltip = false;
                option.KLine.Info = null;
                option.KLine.PageSize = 30;
                option.ExtendChart = [{ Name: 'KLineTooltip' }];
                option.IsCorssOnlyDrawKLine = true;
                option.CorssCursorTouchEnd = true;
                for (var i in option.Windows) { option.Windows[i].Modify = false; option.Windows[i].Change = false; }
            }

            JSComplier.AddVariant({ Name: 'ZSSG', Description: '中枢上轨' });
            chart.SetOption(option);
            resizeCanvas();
        });
    </script>
